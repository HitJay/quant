{% extends "base.html" %}
{% block body %}

<div class="mt-2 mb-4">
  <div class="pill bg-[#3a1a1a] border border-[#5a2a2a] text-rose">散户避坑 · 04 / 06</div>
  <h1 class="mt-3 text-[52px] font-black leading-[1.05] text-white">
    3 个致命陷阱<br>
    <span class="text-2xl font-bold text-muted">你中过哪一条?</span>
  </h1>
</div>

<div class="flex-1 flex flex-col gap-4">
  {% for t in data.p4.traps %}
  <div class="card p-6 flex gap-5">
    <div class="mono text-[72px] font-black leading-none {% if loop.index == 1 %}text-rose{% elif loop.index == 2 %}text-orange{% else %}text-red{% endif %}">
      {{ t.num }}
    </div>
    <div class="flex-1 border-l border-[#30363d] pl-5">
      <div class="text-white text-2xl font-bold leading-tight mb-2">{{ t.title }}</div>
      <div class="text-muted text-base leading-snug">{{ t.detail }}</div>
    </div>
  </div>
  {% endfor %}
</div>

<div class="mt-4 card2 p-5">
  <div class="text-cyan text-sm font-bold mono mb-2">// 复旦杰伦说</div>
  <div class="text-white text-lg leading-snug">
    涨停板是 A 股最锋利的双刃剑 —
    <span class="text-gold">追板前先问自己</span>: 如果炸了, 我能扛住多少?
  </div>
</div>

{% endblock %}
